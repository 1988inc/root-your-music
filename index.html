<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root Your Music - UI Mock</title>
  <style>
    :root{
      --bg:#070707;
      --panel:#101010;
      --line:#2a2a2a;
      --text:#f3f0e8;
      --muted:#aaa69d;
      --gold:#c7a044;
      --gold2:#e2bf5f;
      --s:#ff5b2f;
      --a:#d9a51b;
      --b:#6da7c7;
      --spotify:#1ed760;
      --apple:#ff4f73;
      --ytm:#ef3340;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      background:radial-gradient(circle at 15% 0%,rgba(199,160,68,.08),transparent 28rem),var(--bg);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .topbar{
      position:sticky;top:0;z-index:10;
      border-bottom:1px solid rgba(199,160,68,.22);
      background:rgba(7,7,7,.95);
      backdrop-filter:blur(12px);
    }
    .topbar-inner{
      max-width:1120px;margin:0 auto;
      display:flex;align-items:center;gap:24px;
      padding:10px 22px;min-height:76px;
    }
    .brand{display:flex;align-items:center;gap:12px;flex:none}
    .logo{
      width:56px;height:56px;border:1.5px solid var(--gold);border-radius:50%;
      display:grid;place-items:center;position:relative;color:var(--gold);
      font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;
    }
    .logo span{transform:translateY(-7px);font-size:20px}
    .logo:after{
      content:"";position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
      width:30px;height:16px;
      background:
        radial-gradient(circle at 0 100%,var(--gold) 0 2px,transparent 3px),
        radial-gradient(circle at 50% 100%,var(--gold) 0 2px,transparent 3px),
        radial-gradient(circle at 100% 100%,var(--gold) 0 2px,transparent 3px),
        linear-gradient(var(--gold),var(--gold)) 50% 0/1px 12px no-repeat,
        linear-gradient(27deg,transparent 48%,var(--gold) 49% 51%,transparent 52%) 0 1px/15px 11px no-repeat,
        linear-gradient(-27deg,transparent 48%,var(--gold) 49% 51%,transparent 52%) 100% 1px/15px 11px no-repeat;
    }
    .brand-copy strong{
      display:block;font-family:Georgia,serif;color:var(--gold2);font-size:21px;
    }
    .brand-copy small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .nav{display:flex;gap:18px;margin-left:auto;font-size:14px}
    .nav a.active{color:var(--gold2)}
    .top-search{
      width:min(320px,30vw);height:42px;padding:0 14px;
      border:1px solid #333;border-radius:10px;background:#101010;color:#fff;
    }
    .main{max-width:1120px;margin:0 auto;padding:28px 22px 72px}
    .hero{
      display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
      padding-bottom:22px;border-bottom:1px solid var(--line);
    }
    .hero h1{margin:0;color:var(--gold2);font-family:Georgia,serif;font-size:40px}
    .hero p{margin:8px 0 0;color:var(--muted)}
    .count{font-size:13px;color:var(--muted)}
    .filters{display:flex;gap:10px;flex-wrap:wrap;padding:18px 0 24px}
    .chip{
      border:1px solid #343434;background:#0f0f0f;color:#ddd;
      border-radius:10px;padding:9px 14px;
    }
    .chip.active{
      background:linear-gradient(#e0bd60,#b9892d);color:#17120a;border-color:#d8b85d;font-weight:700;
    }
    .song-list{display:grid;gap:18px}
    .song-card{
      background:linear-gradient(180deg,#111,#0d0d0d);
      border:1px solid #262626;border-radius:16px;overflow:hidden;
      box-shadow:0 16px 40px rgba(0,0,0,.28);
    }
    .song-head{
      display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
      padding:18px 20px 12px;
    }
    .song-title-row{display:flex;gap:12px;align-items:flex-start}
    .index{
      width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:rgba(199,160,68,.18);color:var(--gold2);border:1px solid rgba(199,160,68,.35);font-weight:700;
    }
    .song-title h2{font-size:20px;margin:0 0 4px}
    .artist-main{color:var(--gold2);font-weight:700}
    .meta{font-size:13px;color:var(--muted);margin-top:5px}
    .root-count{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
    .root-count b{
      color:var(--gold2);font-size:18px;min-width:34px;height:34px;border-radius:50%;
      display:grid;place-items:center;background:rgba(199,160,68,.16)
    }
    .service-row{display:flex;gap:9px;flex-wrap:wrap;padding:0 20px 14px 66px}
    .service{
      display:inline-flex;align-items:center;gap:7px;padding:8px 11px;
      border:1px solid #2c2c2c;border-radius:9px;background:#121212;font-size:13px;
    }
    .service:before{content:"";width:11px;height:11px;border-radius:50%;background:currentColor}
    .spotify{color:var(--spotify)} .apple{color:var(--apple)} .ytm{color:var(--ytm)}
    .video{
      width:380px;max-width:calc(100% - 86px);
      margin:0 20px 18px 66px;aspect-ratio:16/9;border:1px solid #343434;border-radius:12px;
      background:linear-gradient(120deg,rgba(0,0,0,.7),rgba(0,0,0,.18)),
        radial-gradient(circle at 70% 35%,rgba(199,160,68,.3),transparent 35%),#171717;
      position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px;
    }
    .play{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:62px;height:44px;border-radius:13px;background:#ff0033;
      display:grid;place-items:center;color:#fff;font-size:21px;
    }
    .play:after{content:"▶";transform:translateX(2px)}
    .video small{position:relative;z-index:1;background:rgba(0,0,0,.65);padding:5px 8px;border-radius:6px}
    .roots{border-top:1px solid var(--line);padding:0 20px 12px 66px}
    .roots-title{margin:0;padding:14px 0 8px;color:#ddd;font-weight:700;font-size:14px}
    .root{padding:15px 0 18px;border-top:1px solid #242424}
    .root:first-of-type{border-top:0}
    .root-main{display:grid;grid-template-columns:44px 1fr;gap:12px}
    .rank{
      width:40px;height:40px;border-radius:9px;display:grid;place-items:center;
      font-size:20px;font-weight:700;border:1px solid currentColor;
    }
    .s{color:var(--s)} .a{color:var(--a)} .b{color:var(--b)}
    .root h3{margin:0 0 3px;font-size:18px}
    .root .artist{color:#c7c2b8}
    .comment{margin:10px 0 0;color:#ddd;line-height:1.7;font-size:14px}
    .root .service-row{padding:12px 0 0 56px}
    .root .video{width:380px;max-width:calc(100% - 56px);margin:12px 0 0 56px}
    .pager{display:flex;justify-content:center;gap:8px;padding:30px 0 10px}
    .pager span{
      width:38px;height:38px;border:1px solid #333;border-radius:8px;display:grid;place-items:center;color:#ccc;
    }
    .pager .current{background:var(--gold);color:#111;border-color:var(--gold)}

    @media(max-width:760px){
      .topbar-inner{padding:8px 16px;min-height:66px}
      .brand{margin:0 auto}.brand-copy,.nav,.top-search{display:none}
      .logo{width:50px;height:50px}
      .main{padding:18px 12px 70px}
      .hero{grid-template-columns:1fr;gap:8px;padding-bottom:16px}
      .hero h1{font-size:27px}
      .filters{overflow:auto;flex-wrap:nowrap;padding:14px 0 18px}
      .chip{white-space:nowrap}
      .song-head{padding:16px 14px 11px}
      .index{width:31px;height:31px}
      .song-title h2{font-size:18px}
      .service-row{padding:0 14px 13px 55px;gap:7px}
      .service{padding:7px 9px;font-size:12px}
      .video{width:auto;max-width:none;margin:0 14px 16px 55px}
      .roots{padding:0 14px 8px 55px}
      .root-main{grid-template-columns:39px 1fr;gap:10px}
      .rank{width:38px;height:38px;font-size:18px}
      .root h3{font-size:17px}
      .root .service-row{padding:11px 0 0 49px}
      .root .video{width:auto;max-width:none;margin:11px 0 0 49px}
      .comment{font-size:13px}
    }
    @media(max-width:430px){
      .root-count span{display:none}
      .service{flex:1 1 30%;justify-content:center}
    }
  
.loading,.error{padding:28px;border:1px solid #292929;border-radius:14px;background:#0f0f0f;color:var(--muted);text-align:center}
.error{color:#ff9b9b}.service.disabled{opacity:.3;pointer-events:none}
.video.real{padding:0;background:#111}.video.real iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span>RYM</span></div>
      <div class="brand-copy">
        <strong>Root Your Music</strong>
        <small>音楽のルーツをたどる、つながる。</small>
      </div>
    </div>
    <nav class="nav">
      <a class="active" href="#">曲一覧</a>
      <a href="#">アーティスト</a>
      <a href="#">ルーツネットワーク</a>
      <a href="#">ランキング</a>
      <a href="#">AI裁判官</a>
    </nav>
    <input class="top-search" placeholder="曲名・アーティスト名で検索">
  </div>
</header>

<main class="main">
  <section class="hero">
    <div>
      <h1>曲のルーツ一覧</h1>
      <p>気になる曲と、その元ネタ候補をその場で聴き比べ。</p>
    </div>
    <div class="count"><span id="dataCount">データを読み込み中…</span></div>
  </section>

  <div class="filters">
    <button class="chip active">すべて</button>
    <button class="chip">日本</button>
    <button class="chip">海外</button>
    <button class="chip">年代</button>
    <button class="chip">新着</button>
    <button class="chip">関連度順</button>
  </div>

  <section class="song-list" id="songList"><div class="loading">楽曲データを読み込んでいます…</div></section>


</main>

<script>
const API_BASE="https://script.google.com/macros/s/AKfycby9J_nZ56jygcgeU-RNRct25fRtdNzOVkgtlDCaqiOvxXqUFwm2uu14yzXoXfMgmWPRPQ/exec";
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const dateOnly=v=>v?String(v).slice(0,10):"";
function ytId(url){if(!url)return null;try{const u=new URL(url);if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0];if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")return u.searchParams.get("v");const p=u.pathname.split("/").filter(Boolean);for(const x of ["embed","shorts","live"]){const i=p.indexOf(x);if(i>=0)return p[i+1]||null}}}catch(e){}return null}
function services(x){return `<div class="service-row">${[["spotify","Spotify",x.spotify_url],["apple","Apple Music",x.apple_music_url],["ytm","YouTube Music",x.youtube_music_url]].map(([c,n,u])=>u?`<a class="service ${c}" href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`:`<span class="service ${c} disabled">${n}</span>`).join("")}</div>`}
function video(x){const id=ytId(x.youtube_url);return id?`<div class="video real"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}" title="${esc(x.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:""}
function root(r){const x=r.song;if(!x)return"";return `<section class="root"><div class="root-main"><div class="rank ${esc(String(r.rank||"").toLowerCase())}">${esc(r.rank||"-")}</div><div><h3>${esc(x.title)}</h3><div class="artist">${esc(x.artist?.name||"")}</div><div class="meta">${esc(dateOnly(x.release_date))}</div>${r.comment?`<p class="comment">${esc(r.comment)}</p>`:""}</div></div>${services(x)}${video(x)}</section>`}
function card(x,i){const rs=x.roots||[];return `<article class="song-card"><div class="song-head"><div class="song-title-row"><div class="index">${i+1}</div><div class="song-title"><h2>${esc(x.title)}</h2><div class="artist-main">${esc(x.artist?.name||"")}</div><div class="meta">${esc(dateOnly(x.release_date))}</div></div></div><div class="root-count"><span>ルーツ</span><b>${rs.length}</b></div></div>${services(x)}${video(x)}<div class="roots"><p class="roots-title">この曲のルーツ</p>${rs.length?rs.map(root).join(""):'<div class="meta" style="padding-bottom:16px">ルーツ情報はまだありません。</div>'}</div></article>`}
async function api(action,params={}){const u=new URL(API_BASE);u.searchParams.set("action",action);for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}
async function load(){const list=document.getElementById("songList"),cnt=document.getElementById("dataCount");try{const songs=await api("songs");const roots=await api("roots");const details=await Promise.all(songs.map(x=>api("song",{id:x.id})));list.innerHTML=details.map(card).join("")||'<div class="loading">登録曲がありません。</div>';cnt.textContent=`登録曲 ${songs.length}曲 ／ ルーツ関係 ${roots.length}件`}catch(e){console.error(e);list.innerHTML=`<div class="error">APIからデータを取得できませんでした。<br>${esc(e.message)}</div>`;cnt.textContent="データ取得エラー"}}
load();
</script>
</body>
</html>
